services:
  # Production image: static build served by nginx.
  app:
    build: .
    ports:
      - "8080:80"
    restart: unless-stopped

  # Development: Vite dev server and test runner. node_modules stays in a
  # named volume so nothing is installed on the host.
  dev:
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
